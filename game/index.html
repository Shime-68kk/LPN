<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#3B2A4A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Sâu Tím</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" />
  <link rel="stylesheet" href="game.css?v=2" />
</head>
<body>
  <canvas id="stage" aria-label="Màn chơi Sâu Tím"></canvas>

  <!-- HUD khi đang chơi -->
  <div id="hud" class="hud" hidden>
    <div class="hud-top">
      <button class="icon-btn" id="btn-pause" type="button" aria-label="Tạm dừng">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12" /></svg>
      </button>
      <div class="hud-mid">
        <div class="progress-wrap">
          <div class="progress"><span id="progress-fill"></span></div>
          <div class="pstars" id="pstars" aria-label="Sao đã đạt"></div>
        </div>
        <div class="hud-row">
          <div class="hearts" id="hearts" aria-label="Số tim còn lại"></div>
          <span class="speed" id="speed" hidden>x1,0</span>
        </div>
      </div>
      <div class="score">
        <span id="score">0</span>
        <small><span id="length">4</span> đốt</small>
      </div>
    </div>
    <div class="combo" id="combo" hidden><b id="combo-num">0</b> combo</div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="hint" class="hint" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-1.5a1.5 1.5 0 0 1 3 0V12m0-.5a1.5 1.5 0 0 1 3 0V13m0-.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L5 16.5a1.6 1.6 0 0 1 2.4-2.1L8 15" /></svg>
    Kéo ngón tay qua lại để bé sâu ăn lá
  </div>

  <!-- Menu chọn bài -->
  <section id="menu" class="sheet">
    <header class="sheet-head">
      <a class="icon-btn ghost" href="../index.html" aria-label="Về trang chính">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
      </a>
      <div>
        <h1>Sâu Tím</h1>
        <p>Ăn lá theo nhịp nhạc, lớn lên thành bướm.</p>
      </div>
    </header>
    <div class="segmented" role="radiogroup" aria-label="Độ khó">
      <button type="button" role="radio" data-diff="1" aria-checked="true">Dễ</button>
      <button type="button" role="radio" data-diff="2" aria-checked="false">Vừa</button>
    </div>
    <ul class="songs" id="songs"></ul>
    <label class="toggle">
      <input type="checkbox" id="opt-sfx" checked />
      <span>Âm thanh khi ăn lá</span>
    </label>
  </section>

  <!-- Tạm dừng -->
  <section id="pause" class="overlay" hidden>
    <div class="card">
      <h2>Tạm dừng</h2>
      <button type="button" class="btn primary" id="btn-resume">Chơi tiếp</button>
      <button type="button" class="btn" id="btn-finish" hidden>Kết thúc &amp; hoá bướm</button>
      <button type="button" class="btn" id="btn-restart">Chơi lại từ đầu</button>
      <button type="button" class="btn" id="btn-menu">Chọn bài khác</button>
    </div>
  </section>

  <!-- Kết quả -->
  <section id="result" class="overlay" hidden>
    <div class="card">
      <div class="stars" id="res-stars" aria-label="Số sao"></div>
      <h2 id="res-title">Hoá bướm rồi!</h2>
      <p class="message" id="res-message"></p>
      <dl class="stats">
        <div><dt>Điểm</dt><dd id="res-score">0</dd></div>
        <div><dt>Combo cao nhất</dt><dd id="res-combo">0</dd></div>
        <div><dt>Sâu dài</dt><dd id="res-length">0</dd></div>
        <div><dt>Tốc độ</dt><dd id="res-speed">x1,0</dd></div>
      </dl>
      <p class="best" id="res-best" hidden>Kỷ lục mới!</p>
      <button type="button" class="btn primary" id="btn-again">Chơi lại</button>
      <button type="button" class="btn" id="btn-songs">Chọn bài khác</button>
    </div>
  </section>

  <script src="game.js?v=3"></script>
</body>
</html>
