<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E0B16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hồi ức</title>
  <!-- Trang này luôn tối (như phòng chiếu phim): tô nền ngay từ đầu để chuyển trang không chớp sáng. -->
  <script>document.documentElement.style.background = '#0E0B16';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Dancing+Script:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
  <link rel="stylesheet" href="hoi-uc.css?v=2" />
</head>
<body>
  <!-- Chương 17 (bản xem thử): mở lại toàn bộ kỷ niệm như xem lại ảnh trên một chiếc máy ảnh cũ,
       ảnh dán trong một cuốn sổ, lật từng trang. Xong thì đưa về web cũ (legacy/), nơi mọi thứ bắt đầu. -->
  <canvas class="grain" id="grain" aria-hidden="true"></canvas>
  <div class="leak leak-a" aria-hidden="true"></div>
  <div class="leak leak-b" aria-hidden="true"></div>

  <!-- Màn mở đầu: nút chụp -->
  <section class="start" id="start">
    <p class="start-kicker">Hồi ức</p>
    <button class="shutter" id="btn-start" type="button" aria-label="Chạm để xem lại">
      <span class="shutter-ring"></span><span class="shutter-dot"></span>
    </button>
    <p class="start-hint" id="start-hint">Đang lấy ảnh ra…</p>
  </section>

  <!-- Những dòng chữ trước khi mở sổ -->
  <section class="lines" id="lines" hidden></section>

  <!-- Cuốn sổ -->
  <section class="stage" id="stage" hidden>
    <div class="book" id="book"></div>
  </section>

  <!-- Khung ngắm máy ảnh, phủ lên trên khi đang xem -->
  <div class="hud" id="hud" hidden aria-hidden="true">
    <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
    <span class="hud-play"><b>▶</b> PLAY</span>
    <span class="hud-count" id="hud-count">000/000</span>
    <span class="hud-batt"><i></i><i></i><i></i></span>
    <span class="hud-date" id="hud-date"></span>
  </div>

  <!-- Kết -->
  <section class="end" id="end" hidden>
    <p class="end-line" id="end-1"></p>
    <p class="end-line big" id="end-2">Đây là nơi mọi thứ bắt đầu.</p>
    <a class="end-btn" id="end-go" href="../legacy/">Về ngày đầu tiên</a>
    <button class="end-again" id="end-again" type="button">Xem lại</button>
  </section>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <script src="hoi-uc.js?v=2"></script>
</body>
</html>
