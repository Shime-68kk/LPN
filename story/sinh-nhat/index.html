  #nam { bottom: calc(6.2vh + env(safe-area-inset-bottom)); font: 400 clamp(10px, 1.15vw, 14px)/1 'Be Vietnam Pro', sans-serif; letter-spacing: .32em; text-transform: none; opacity: 0; color: #e4ddd1; text-shadow: 0 1px 10px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.7); }
  #ket { top: 50%; transform: translateY(-50%); padding: 0 8vw; }

  #ket p.hien { opacity: 1; transform: none; }
  #ket p.chot { font-style: normal; font-weight: 400; letter-spacing: .02em; color: #fff3df; margin-top: .4em; }
  #mo { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000; color: #e9e1d4; font-family: 'Be Vietnam Pro', sans-serif; transition: opacity 1.4s ease; cursor: default; }
  #mo.di { opacity: 0; pointer-events: none; }
  #mo h1 { margin: 0 0 .7em; font: italic 400 clamp(26px, 4.2vw, 46px)/1.1 'Cormorant Garamond', serif; letter-spacing: .02em; color: #f3eadb; }
  #mo .nho { margin: 0; font: 300 clamp(13px, 1.6vw, 17px)/1.8 'Be Vietnam Pro', sans-serif; color: rgba(233,225,212,.62); text-align: center; padding: 0 8vw; }
  #mo .thanh { width: min(220px, 40vw); height: 1px; margin: 2.2em 0 0; background: rgba(255,255,255,.12); overflow: hidden; }
  #mo-thanh { height: 100%; background: rgba(255,236,206,.75); transform-origin: left; transform: scaleX(0); transition: transform .4s ease; }
  #mo .bam { margin-top: 1.9em; font: 300 clamp(13px, 1.5vw, 16px)/1 'Be Vietnam Pro', sans-serif; letter-spacing: .28em; color: rgba(255,240,220,.0); transition: color 1.2s ease; }
  #mo.san { cursor: pointer; }
  #mo.san .bam { color: rgba(255,240,220,.86); animation: tho 2.8s ease-in-out infinite; }
  #mo.san .thanh { opacity: 0; transition: opacity .8s ease; }
  @keyframes tho { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  #thu { position: fixed; inset: 0; z-index: 15; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; opacity: 0; pointer-events: none; transition: opacity 2.4s ease; background: radial-gradient(ellipse at 50% 40%, rgba(24,20,16,.92), rgba(0,0,0,.98)); }
  #thu.hien { opacity: 1; pointer-events: auto; }
  #cuoi { position: fixed; left: 0; right: 0; bottom: calc(3.2vh + env(safe-area-inset-bottom)); z-index: 16; display: flex; justify-content: center; gap: 28px; opacity: 0; pointer-events: none; transition: opacity 1.6s ease; }
  #cuoi.hien { opacity: 1; pointer-events: auto; }
  #cuoi button { appearance: none; border: 0; background: rgba(0,0,0,.35); color: #f2e8d8; font: 300 15px/1 'Be Vietnam Pro', sans-serif; letter-spacing: .14em; padding: 12px 18px; border-radius: 22px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #xoay { display: none; position: fixed; inset: 0; z-index: 30; background: #000; color: #e9e1d4; align-items: center; justify-content: center; text-align: center; font: 300 16px/1.7 'Be Vietnam Pro', sans-serif; padding: 0 12vw; }
  @media (orientation: portrait) and (pointer: coarse) { #xoay { display: flex; } }
