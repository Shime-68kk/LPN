  <!-- Trang luôn tối: tô nền ngay từ đầu để chuyển trang không chớp sáng. Chưa mở khoá web thì về trang nhà. -->
  <script>
    document.documentElement.style.background = '#000';
    try { if (localStorage.getItem('lpn:unlock') !== 'a9ed65df' || (localStorage.getItem('lpn:preview') !== '1' && (!localStorage.getItem('lpn:relock2') || (localStorage.getItem('lpn:who') === 'quang' && !localStorage.getItem('lpn:relock1'))))) location.replace('../home/'); } catch (e) { /* bỏ qua */ }
    // Chương 21 mở lúc 12:00 ngày 12/11/2026. Trước giờ đó trang khoá với mọi tài khoản; chỉ link riêng của anh Quang (?k=…) vào được,
    // và vào bằng link riêng thì không lưu gì (window.CONLAI_XEMTHU). Trong trang chỉ có mã băm của khoá, không có khoá thật.
    (function () {
      var k = (location.search.match(/[?&]k=([a-z0-9]+)/) || [])[1] || '', h = 0x811c9dc5, s = 'conlai:' + k;
      for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
      window.CONLAI_XEMTHU = !!k && h.toString(16) === '30f284ec';
      if (Date.now() < Date.parse('2026-11-12T12:00:00+07:00') && !window.CONLAI_XEMTHU && !/^(localhost|127\.0\.0\.1|192\.168\.)/.test(location.hostname)) location.replace('./?play=c23');
    })();
  </script>

       không vẽ người, chỉ đồ vật và ánh sáng. Em chỉ làm một việc: chạm giữ để bước một bước.
       Kịch bản: _kich-ban-999-buoc.md. Cảnh vẽ bằng canvas (con-lai.js), âm thanh ở con-lai-am.js. -->
