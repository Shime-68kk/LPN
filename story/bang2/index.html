<!-- Trang luôn tối: tô nền ngay từ đầu để chuyển trang không chớp sáng. Chưa mở khoá web thì về trang nhà. -->
<script>
  document.documentElement.style.background = '#000';
  try { if (localStorage.getItem('lpn:unlock') !== 'a9ed65df' && !/^(localhost|127\.0\.0\.1|192\.168\.)/.test(location.hostname)) location.replace('../../home/'); } catch (e) { /* bỏ qua */ }
  // Chơi dở thì lần sau vào tiếp từ chặng đã tới (lpn:bang2 chỉ lưu số chặng, không đồng bộ). ?moi=1: chơi lại từ đầu.
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('moi') === '1') { localStorage.removeItem('lpn:bang2'); q.delete('moi'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); }
    else if (!q.get('phong')) { var sv = JSON.parse(localStorage.getItem('lpn:bang2') || '{}'); if (sv.phong) { q.set('phong', sv.phong); history.replaceState(null, '', location.pathname + '?' + q); } }
  } catch (e) { /* bỏ qua */ }
</script>
